name = "dummrum"
main = "./src/worker.ts"
compatibility_date = "2026-03-17"
compatibility_flags = []

[observability]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[triggers]
crons = ["0 */2 * * *"]

[[queues.producers]]
binding = "JOURNEY_QUEUE"
queue = "journey-polls"

[[queues.consumers]]
queue = "journey-polls"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "journey-polls-dlq"

[assets]
binding = "ASSETS"
directory = "./dist"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "rmv-departures"
database_id = "6db89bbe-ac67-4d65-864e-5c6b19150a28"
migrations_dir = "migrations"
